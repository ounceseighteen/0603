{% extends 'base.html' %}{% block title %}Новое занятие — SchoolFlow{% endblock %}{% block heading %}Новое занятие{% endblock %}{% block content %}<div class="form-card"><form method="post" class="form-grid"><label>День недели<select name="weekday">{% for number,name in days.items() %}<option value="{{ number }}">{{ name }}</option>{% endfor %}</select></label><label>Номер урока<input name="lesson_number" type="number" min="1" max="12" value="1" required></label><label>Начало<input name="start_time" value="08:30" required></label><label>Окончание<input name="end_time" value="09:15" required></label><label>Класс<select name="class_group_id">{% for item in classes %}<option value="{{ item.id }}">{{ item.name }}</option>{% endfor %}</select></label><label>Учитель<select name="teacher_id">{% for item in teachers %}<option value="{{ item.id }}">{{ item.full_name }}</option>{% endfor %}</select></label><label>Предмет<select name="subject_id">{% for item in subjects %}<option value="{{ item.id }}">{{ item.name }}</option>{% endfor %}</select></label><label>Кабинет<select name="classroom_id">{% for item in rooms %}<option value="{{ item.id }}">{{ item.name }}</option>{% endfor %}</select></label><div class="form-actions"><a class="button ghost" href="{{ url_for('schedule.index') }}">Отмена</a><button class="button primary">Сохранить занятие</button></div></form></div>{% endblock %}
